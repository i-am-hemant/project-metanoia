name: CI

on:
  pull_request:
    branches: [main]

# Read-only: this workflow must never publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Media is stored in Git LFS; pointer files would break the build.
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and validate content schemas
        run: pnpm run check

      - name: Build site and Pagefind index
        run: pnpm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/pagefind/pagefind-entry.json
          if grep -rq -- 'git-lfs.github.com/spec/v1' dist/; then
            echo "::error::Git LFS pointer files found in dist/ — checkout did not fetch LFS objects."
            grep -rl -- 'git-lfs.github.com/spec/v1' dist/
            exit 1
          fi
